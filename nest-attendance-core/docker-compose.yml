name: dexa

services:
  attendance-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: attendance_db
    ports:
      - 3308:3306
    volumes:
      - attendance_mysql_data:/var/lib/mysql

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    restart: "no"
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 8;
      mc alias set local http://minio:9000 admin password;
      mc mb --ignore-existing local/attendance-photos;
      mc anonymous set download local/attendance-photos;
      exit 0;
      "

volumes:
  attendance_mysql_data:
  minio_data:
